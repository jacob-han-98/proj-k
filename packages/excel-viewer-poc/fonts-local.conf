<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!--
    Windows 한국어 폰트(컨테이너 미설치)를 설치된 Noto Sans CJK KR 로 매핑.
    이유: xlsx 열 너비는 "기본 폰트의 '0' 글자 너비" 단위로 저장됨. 기본 폰트
    '맑은 고딕'(Malgun Gothic)이 없으면 fontconfig 가 라틴 폰트 DejaVu Sans 로 대체 →
    '0' 너비가 달라 OnlyOffice 가 열 픽셀폭을 Excel 과 다르게 계산 → 서로 다른 열에
    앵커된 흐름도 노드와 연결선이 어긋남(detached). Noto Sans CJK KR 로 매핑하면
    한국어 폰트 메트릭으로 계산되어 정렬이 맞춰짐. (2026-06-07 변신 시트에서 확인)
  -->
  <match target="pattern">
    <test name="family"><string>맑은 고딕</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Malgun Gothic</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>돋움</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Dotum</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>굴림</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>바탕</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK KR</string></edit>
  </match>
</fontconfig>
